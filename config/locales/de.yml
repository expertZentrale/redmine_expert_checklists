  # Plugin settings
  label_expert_checklist_notifications: "Mails bei Checklisten-Änderungen"
  label_expert_checklist_notifications_issue_updated: "Wie bei Ticket-Änderungen"
  label_expert_checklist_notifications_always: "Immer"
  label_expert_checklist_notifications_never: "Nie"
  text_expert_checklist_notifications: "Häkchen derselben Person innerhalb von %{seconds} Sekunden werden ein Verlaufseintrag und eine Mail; die Mail geht raus, sobald so lange niemand mehr abgehakt hat. Checklisten-Änderungen, die mit dem Ticketformular gespeichert werden, gehen sofort raus, zusammen mit dem Rest der Änderung. \"Wie bei Ticket-Änderungen\" verschickt sie, wenn Redmine Ticket-Änderungen verschickt (Administration » Konfiguration » E-Mail-Benachrichtigungen)."
  label_expert_checklist_done_ratio: "% erledigt aus der Checkliste"
  text_expert_checklist_done_ratio: "Setzt % erledigt auf den Anteil abgehakter Punkte, auf Zehner abgerundet. Abschnitte zählen nicht; ein Ticket ohne Punkte behält seinen Wert."
  text_expert_checklist_done_ratio_inactive: "Wirkt zurzeit nicht: % erledigt wird aus dem Ticket-Status berechnet (Administration » Konfiguration » Tickets)."
  label_expert_checklist_block_closing: "Schließen bei offenen Punkten sperren"
  text_expert_checklist_block_closing: "Ein Ticket kann nicht auf einen geschlossenen Status gesetzt werden, solange es offene Checklistenpunkte hat."
  label_expert_checklist_legacy_import: "Übernahme aus RedmineUP Checklists"
  text_expert_checklist_legacy_import_intro: "Übernimmt Checklisten, Berechtigungen, Einstellungen und gespeicherte Abfragen aus dem Plugin RedmineUP Checklists. Zeigt vorher, was übernommen würde, bevor etwas geschrieben wird."
  text_expert_checklist_legacy_import_done_at: "Letzte Übernahme: %{time}"
  label_expert_checklist_legacy_import_open: "Übernahme öffnen"

  # RedmineUP import page
  label_expert_checklist_import_phase: "Schritt"
  label_expert_checklist_import_found: "Gefunden"
  label_expert_checklist_import_phase_items: "Checklisten"
  label_expert_checklist_import_phase_permissions: "Berechtigungen"
  label_expert_checklist_import_phase_settings: "Einstellungen"
  label_expert_checklist_import_phase_queries: "Gespeicherte Abfragen"
  label_expert_checklist_import_phase_modules: "Projektmodul"
  text_expert_checklist_import_phase_items: "Kopiert die Punkte mit denselben IDs, damit der RedmineUP-Verlauf lesbar bleibt. Solange RedmineUP installiert ist, werden Tickets noch nicht umgestellter Projekte erneut kopiert (dort ist RedmineUP noch in Gebrauch); sonst nur Tickets ohne Checkliste von uns."
  text_expert_checklist_import_phase_permissions: "Jede Rolle, die RedmineUP-Checklisten ansehen, abhaken oder bearbeiten darf, bekommt hier dieselbe Berechtigung."
  text_expert_checklist_import_phase_settings: "% erledigt aus der Checkliste, die Sperre beim Schließen und die Mail-Einstellung."
  text_expert_checklist_import_phase_queries: "Ersetzt die Checklisten-Spalte und -Filter von RedmineUP in gespeicherten Ticket-Abfragen."
  text_expert_checklist_import_phase_modules: "Schaltet das Modul „expert Checklisten“ in jedem Projekt mit Ticket-Tracking ein, und für neue Projekte; das eigene Modul von RedmineUP geht dort aus, falls es eines hat."
  text_expert_checklist_import_items: "%{items} Punkte in %{issues} Tickets; %{pending} Tickets zu übernehmen, %{done} schon übernommen"
  text_expert_checklist_import_items_skipped: "Übersprungen: %{orphans} Punkte gelöschter Tickets, %{blank} leere Punkte. %{long} Punkte werden auf 1000 Zeichen gekürzt."
  text_expert_checklist_import_roles: "%{count} Rollen anzupassen"
  text_expert_checklist_import_queries: "%{count} Abfragen umzustellen"
  text_expert_checklist_import_projects: "%{count} Projekte einzuschalten"
  text_expert_checklist_import_blocked: "Erst wenn RedmineUP Checklists entfernt ist oder sich projektweise abschalten lässt: sonst zeigt jedes Ticket zwei Checklisten."
  text_expert_checklist_import_redmineup_installed: "RedmineUP Checklists ist noch installiert. Checklisten, Berechtigungen und Einstellungen lassen sich zum Ausprobieren übernehmen; gespeicherte Abfragen und das Projektmodul folgen, wenn RedmineUP entfernt ist, oder unten projektweise."
  text_expert_checklist_import_no_table: "Keine Daten von RedmineUP Checklists gefunden."
  button_expert_checklist_import_run: "Übernehmen"
  notice_expert_checklist_import_done: "Übernahme abgeschlossen: %{result}"
  error_expert_checklist_import_no_phase: "Nichts übernommen - bitte mindestens einen Schritt wählen."
  text_expert_checklist_import_queries_blocked: "Erst wenn alle Projekte umgestellt sind oder RedmineUP Checklists entfernt ist: umgestellte Abfragen fänden in Projekten, die noch RedmineUP nutzen, nichts. Die Abfragen eines Projekts werden beim Umstellen des Projekts mit umgestellt."
  label_expert_checklist_import_projects: "Projektweise umstellen"
  text_expert_checklist_import_projects_intro: "Stellt die gewählten Projekte von RedmineUP Checklists auf expert Checklisten um, während RedmineUP für die übrigen installiert bleibt: kopiert die Checklisten ihrer Tickets und ihre Vorlagen neu, stellt ihre gespeicherten Abfragen um, schaltet unser Modul ein und das von RedmineUP aus. Berechtigungen und Einstellungen vorher oben übernehmen."
  text_expert_checklist_import_projects_status: "%{switched} Projekte umgestellt, %{left} noch nicht."
  text_expert_checklist_import_not_switchable: "RedmineUP Checklists lässt sich nicht für einzelne Projekte abschalten: seine Berechtigungen gehören zum Modul Ticket-Tracking. Für die projektweise Umstellung müssen sie in ein eigenes Projektmodul (siehe README)."
  button_expert_checklist_import_switch: "Projekte umstellen"
  notice_expert_checklist_import_projects_done: "Umgestellt: %{projects} – %{result}"
  error_expert_checklist_import_no_project: "Nichts umgestellt - bitte mindestens ein Projekt wählen."
  error_expert_checklist_import_project_without_issues: "Diese Projekte nutzen kein Ticket-Tracking, es gibt nichts umzustellen: %{projects}"

  # Templates
  label_expert_checklist_templates: "Checklisten-Vorlagen"
  label_expert_checklist_templates_global: "Globale Vorlagen"
  label_expert_checklist_template_new: "Neue Vorlage"
  label_expert_checklist_template_categories: "Vorlagen-Kategorien"
  label_expert_checklist_template_category_new: "Neue Kategorie"
  label_expert_checklist_from_template: "Aus Vorlage einfügen…"
  field_expert_checklist_template_items: "Punkte"
  field_expert_checklist_template_is_default: "Standard für neue Tickets"
  text_expert_checklist_template_items: "Ein Punkt pro Zeile. Eine Zeile mit -- am Anfang ist ein Abschnitt, [x] markiert einen Punkt als erledigt."
  text_expert_checklist_template_default: "Neue Tickets dieses Projekts starten mit dieser Checkliste - nur für den gewählten Tracker, falls einer gesetzt ist. Vorlagen für einen Tracker gehen denen für alle Tracker vor, Projektvorlagen den globalen."
  text_expert_checklist_template_default_global: "Neue Tickets jedes Projekts mit „expert Checklisten“ starten mit dieser Checkliste, wenn das Projekt keinen eigenen Standard hat - nur für den gewählten Tracker, falls einer gesetzt ist."
  text_expert_checklist_template_added: "%{count} Punkte aus der Vorlage eingefügt"
  text_expert_checklist_templates_global: "Vorlagen für alle Projekte. Sie erscheinen im Ticketformular neben den Vorlagen des Projekts."
  text_expert_checklist_templates_global_in_project: "Werden von Administratoren verwaltet. Ein Standard dieses Projekts geht ihnen vor."
  text_expert_checklist_template_categories: "Kategorien gliedern die Vorlagen im Menü des Ticketformulars. Zum Umsortieren ziehen."
  label_expert_checklist_import_phase_templates: "Vorlagen"
  text_expert_checklist_import_phase_templates: "Kopiert die Checklisten-Vorlagen und -Kategorien von RedmineUP. Solange RedmineUP installiert ist, werden die Vorlagen noch nicht umgestellter Projekte neu kopiert; globale Vorlagen kommen hinzu, wenn sie fehlen. Globale kommen ohne Standard-Kennzeichen, weil RedmineUP nur Projekt-Standards angewendet hat."
  text_expert_checklist_import_templates: "%{count} Vorlagen, davon %{defaults} Standard"
