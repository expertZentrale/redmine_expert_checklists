  text_expert_checklist_section_deleted: "%{label}: sección %{subject} eliminada"
  text_expert_checklist_item_done: "%{label}: elemento %{subject} completado"
  text_expert_checklist_item_undone: "%{label}: elemento %{subject} reabierto"
  text_expert_checklist_item_renamed: "%{label}: elemento cambiado de %{old} a %{new}"
  text_expert_checklist_section_renamed: "%{label}: sección cambiada de %{old} a %{new}"
  text_expert_checklist_item_to_section: "%{label}: elemento %{subject} convertido en sección"
  text_expert_checklist_section_to_item: "%{label}: sección %{subject} convertida en elemento"
