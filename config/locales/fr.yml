  # Plugin settings
  label_expert_checklist_notifications: "E-mails pour les modifications de checklist"
  label_expert_checklist_notifications_issue_updated: "Comme les mises à jour de demandes"
  label_expert_checklist_notifications_always: "Toujours"
  label_expert_checklist_notifications_never: "Jamais"
  text_expert_checklist_notifications: "Les coches d'un même utilisateur en moins de %{seconds} secondes donnent une seule entrée d'historique et un seul e-mail, envoyé dès que personne n'a plus coché pendant ce délai. Les modifications de checklist enregistrées avec le formulaire de la demande sont envoyées immédiatement, avec le reste de la modification. \"Comme les mises à jour de demandes\" les envoie lorsque Redmine envoie les mises à jour de demandes (Administration » Configuration » Notifications par mail)."
  label_expert_checklist_done_ratio: "% réalisé d'après la checklist"
  text_expert_checklist_done_ratio: "Définit % réalisé selon la proportion d'éléments cochés, arrondie à la dizaine inférieure. Les sections ne comptent pas ; une demande sans éléments conserve sa valeur."
  text_expert_checklist_done_ratio_inactive: "Sans effet pour le moment : % réalisé est calculé d'après le statut de la demande (Administration » Configuration » Suivi des demandes)."
  label_expert_checklist_block_closing: "Bloquer la fermeture avec des éléments ouverts"
  text_expert_checklist_block_closing: "Une demande ne peut pas passer à un statut fermé tant qu'elle a des éléments de checklist ouverts."
  label_expert_checklist_legacy_import: "Importer depuis RedmineUP Checklists"
  text_expert_checklist_legacy_import_intro: "Reprend les checklists, les permissions, la configuration et les rapports personnalisés du plugin RedmineUP Checklists. Affiche ce qui serait importé avant toute écriture."
  text_expert_checklist_legacy_import_done_at: "Dernier import : %{time}"
  label_expert_checklist_legacy_import_open: "Ouvrir l'import"

  # RedmineUP import page
  label_expert_checklist_import_phase: "Étape"
  label_expert_checklist_import_found: "Trouvé"
  label_expert_checklist_import_phase_items: "Checklists"
  label_expert_checklist_import_phase_permissions: "Permissions"
  label_expert_checklist_import_phase_settings: "Configuration"
  label_expert_checklist_import_phase_queries: "Rapports personnalisés"
  label_expert_checklist_import_phase_modules: "Module du projet"
  text_expert_checklist_import_phase_items: "Copie les éléments avec les mêmes identifiants, afin que l'historique RedmineUP reste lisible. Tant que RedmineUP est installé, les demandes des projets pas encore basculés sont copiées à nouveau (RedmineUP y est encore utilisé) ; sinon uniquement les demandes sans checklist de ce plugin."
  text_expert_checklist_import_phase_permissions: "Chaque rôle autorisé à voir, cocher ou modifier les checklists RedmineUP reçoit ici la même permission."
  text_expert_checklist_import_phase_settings: "% réalisé d'après la checklist, le blocage de la fermeture et le paramètre des e-mails."
  text_expert_checklist_import_phase_queries: "Remplace la colonne et les filtres de checklist de RedmineUP dans les rapports personnalisés de demandes."
  text_expert_checklist_import_phase_modules: "Active le module expert Checklists dans chaque projet qui utilise le suivi des demandes, ainsi que pour les nouveaux projets ; le module propre de RedmineUP y est désactivé s'il en a un."
  text_expert_checklist_import_items: "%{items} éléments sur %{issues} demandes ; %{pending} demandes à importer, %{done} déjà importées"
  text_expert_checklist_import_items_skipped: "Ignorés : %{orphans} éléments de demandes supprimées, %{blank} éléments vides. %{long} éléments sont tronqués à 1000 caractères."
  text_expert_checklist_import_roles: "%{count} rôles à mettre à jour"
  text_expert_checklist_import_queries: "%{count} rapports à convertir"
  text_expert_checklist_import_projects: "%{count} projets à activer"
  text_expert_checklist_import_blocked: "Uniquement une fois RedmineUP Checklists supprimé ou désactivable par projet : sinon chaque demande affiche deux checklists."
  text_expert_checklist_import_redmineup_installed: "RedmineUP Checklists est toujours installé. Les checklists, les permissions et la configuration peuvent être importées pour essayer ; les rapports personnalisés et le module du projet suivront une fois RedmineUP supprimé, ou projet par projet ci-dessous."
  text_expert_checklist_import_no_table: "Aucune donnée RedmineUP Checklists trouvée."
  button_expert_checklist_import_run: "Importer"
  notice_expert_checklist_import_done: "Import terminé : %{result}"
  error_expert_checklist_import_no_phase: "Rien n'a été importé - choisissez au moins une étape."
  text_expert_checklist_import_queries_blocked: "Uniquement une fois tous les projets basculés ou RedmineUP Checklists supprimé : les rapports convertis ne trouveraient rien dans les projets qui utilisent encore RedmineUP. Les rapports d'un projet sont convertis lors de son basculement."
  label_expert_checklist_import_projects: "Basculer projet par projet"
  text_expert_checklist_import_projects_intro: "Bascule les projets choisis de RedmineUP Checklists vers expert Checklists pendant que RedmineUP reste installé pour les autres : copie à nouveau les checklists de leurs demandes, convertit leurs rapports personnalisés, active notre module et désactive celui de RedmineUP. Importez d'abord les permissions et la configuration ci-dessus."
  text_expert_checklist_import_projects_status: "%{switched} projets basculés, %{left} pas encore."
  text_expert_checklist_import_not_switchable: "RedmineUP Checklists ne peut pas être désactivé dans un seul projet : ses permissions appartiennent au module de suivi des demandes. Pour basculer projet par projet, elles doivent passer dans un module de projet propre (voir le README)."
  button_expert_checklist_import_switch: "Basculer les projets"
  notice_expert_checklist_import_projects_done: "Basculés %{projects} : %{result}"
  error_expert_checklist_import_no_project: "Rien n'a été basculé - choisissez au moins un projet."
