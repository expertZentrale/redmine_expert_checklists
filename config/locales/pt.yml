  # Plugin settings
  label_expert_checklist_notifications: "E-mails para alterações nas listas de verificação"
  label_expert_checklist_notifications_issue_updated: "Como as atualizações de tarefas"
  label_expert_checklist_notifications_always: "Sempre"
  label_expert_checklist_notifications_never: "Nunca"
  text_expert_checklist_notifications: "As marcações do mesmo utilizador num intervalo de %{seconds} segundos dão origem a uma única entrada no histórico e a um único e-mail, enviado quando ninguém tiver marcado nada durante esse tempo. As alterações à lista de verificação guardadas com o formulário da tarefa são enviadas de imediato, juntamente com o resto da edição. \"Como as atualizações de tarefas\" envia-as quando o Redmine envia as atualizações de tarefas (Administração » Configurações » Notificações por e-mail)."
  label_expert_checklist_done_ratio: "% Completo a partir da lista de verificação"
  text_expert_checklist_done_ratio: "Define % Completo como a proporção de itens marcados, arredondada por defeito à dezena. As secções não contam; uma tarefa sem itens mantém o seu valor."
  text_expert_checklist_done_ratio_inactive: "Sem efeito de momento: % Completo é calculado a partir do estado da tarefa (Administração » Configurações » Tarefas)."
  label_expert_checklist_block_closing: "Bloquear o fecho com itens em aberto"
  text_expert_checklist_block_closing: "Uma tarefa não pode passar para um estado fechado enquanto tiver itens da lista de verificação em aberto."
  label_expert_checklist_legacy_import: "Importar do RedmineUP Checklists"
  text_expert_checklist_legacy_import_intro: "Importa as listas de verificação, as permissões, as configurações e as consultas guardadas da extensão RedmineUP Checklists. Mostra o que seria importado antes de gravar o que quer que seja."
  text_expert_checklist_legacy_import_done_at: "Última importação: %{time}"
  label_expert_checklist_legacy_import_open: "Abrir a importação"

  # RedmineUP import page
  label_expert_checklist_import_phase: "Passo"
  label_expert_checklist_import_found: "Encontrado"
  label_expert_checklist_import_phase_items: "Listas de verificação"
  label_expert_checklist_import_phase_permissions: "Permissões"
  label_expert_checklist_import_phase_settings: "Configurações"
  label_expert_checklist_import_phase_queries: "Consultas guardadas"
  label_expert_checklist_import_phase_modules: "Módulo do projeto"
  text_expert_checklist_import_phase_items: "Copia os itens com os mesmos IDs, para que o histórico do RedmineUP continue legível. Enquanto o RedmineUP estiver instalado, as tarefas dos projetos ainda não mudados são copiadas de novo (aí o RedmineUP ainda está em uso); caso contrário, só as tarefas sem lista de verificação desta extensão."
  text_expert_checklist_import_phase_permissions: "Cada função que pode ver, marcar ou editar listas de verificação do RedmineUP recebe aqui a mesma permissão."
  text_expert_checklist_import_phase_settings: "% Completo a partir da lista de verificação, o bloqueio do fecho e a configuração de e-mail."
  text_expert_checklist_import_phase_queries: "Substitui a coluna e os filtros de lista de verificação do RedmineUP nas consultas de tarefas guardadas."
  text_expert_checklist_import_phase_modules: "Ativa o módulo expert Listas de verificação em todos os projetos que usam tarefas, e para os novos projetos; aí o módulo próprio do RedmineUP é desativado, se tiver um."
  text_expert_checklist_import_items: "%{items} itens em %{issues} tarefas; %{pending} tarefas por importar, %{done} já importadas"
  text_expert_checklist_import_items_skipped: "Ignorados: %{orphans} itens de tarefas apagadas, %{blank} itens vazios. %{long} itens são truncados para 1000 caracteres."
  text_expert_checklist_import_roles: "%{count} funções por atualizar"
  text_expert_checklist_import_queries: "%{count} consultas por converter"
  text_expert_checklist_import_projects: "%{count} projetos por ativar"
  text_expert_checklist_import_blocked: "Só depois de o RedmineUP Checklists ter sido removido ou de poder ser desativado por projeto: caso contrário, cada tarefa mostra duas listas de verificação."
  text_expert_checklist_import_redmineup_installed: "O RedmineUP Checklists ainda está instalado. As listas de verificação, as permissões e as configurações podem ser importadas para experimentar; as consultas guardadas e o módulo do projeto seguem-se depois de o RedmineUP ser removido, ou projeto a projeto abaixo."
  text_expert_checklist_import_no_table: "Não foram encontrados dados do RedmineUP Checklists."
  button_expert_checklist_import_run: "Importar"
  notice_expert_checklist_import_done: "Importação concluída: %{result}"
  error_expert_checklist_import_no_phase: "Nada foi importado - escolha pelo menos um passo."
  text_expert_checklist_import_queries_blocked: "Só depois de todos os projetos terem mudado ou de o RedmineUP Checklists ter sido removido: as consultas convertidas não encontrariam nada nos projetos que ainda usam o RedmineUP. As consultas de um projeto são convertidas quando o projeto muda."
  label_expert_checklist_import_projects: "Mudar projeto a projeto"
  text_expert_checklist_import_projects_intro: "Muda os projetos escolhidos do RedmineUP Checklists para expert Listas de verificação enquanto o RedmineUP continua instalado para os restantes: copia de novo as listas de verificação das suas tarefas, converte as suas consultas guardadas, ativa o nosso módulo e desativa o do RedmineUP. Importe primeiro as permissões e as configurações acima."
  text_expert_checklist_import_projects_status: "%{switched} projetos mudados, %{left} ainda não."
  text_expert_checklist_import_not_switchable: "O RedmineUP Checklists não pode ser desativado num único projeto: as suas permissões pertencem ao módulo de tarefas. Para mudar projeto a projeto, têm de passar para um módulo de projeto próprio (ver o README)."
  button_expert_checklist_import_switch: "Mudar projetos"
  notice_expert_checklist_import_projects_done: "Mudados %{projects}: %{result}"
  error_expert_checklist_import_no_project: "Nada foi mudado - escolha pelo menos um projeto."
