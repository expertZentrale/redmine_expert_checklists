  text_expert_checklist_import_redmineup_installed: "RedmineUP Checklists è ancora installato. Checklist, permessi e impostazioni possono essere importati per provare; le query salvate e il modulo del progetto seguiranno dopo la rimozione di RedmineUP, oppure progetto per progetto qui sotto."
