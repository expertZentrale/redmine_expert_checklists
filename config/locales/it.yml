  text_expert_checklist_import_phase_items: "Copia le voci con gli stessi ID, così la cronologia di RedmineUP resta leggibile. Finché RedmineUP è installato, le segnalazioni dei progetti non ancora passati vengono copiate di nuovo (lì RedmineUP è ancora in uso); altrimenti solo le segnalazioni senza una checklist di questo plugin."
