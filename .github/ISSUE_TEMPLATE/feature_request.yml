name: Feature request
description: Suggest a capability for the expert Checklists plugin
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you run into, not only the feature you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Checklist on the issue page
        - Checklist editor in the issue form
        - History / notification mails
        - Issue list column / filters / export
        - REST API
        - Import from RedmineUP Checklists
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
