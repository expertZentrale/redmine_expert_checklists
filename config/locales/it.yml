  text_expert_checklist_notifications: "Le spunte dello stesso utente entro %{seconds} secondi diventano un'unica voce della cronologia e un'unica email, inviata quando per quel tempo nessuno ha più spuntato nulla. Le modifiche alla checklist salvate con il modulo della segnalazione vengono inviate subito, insieme alle altre modifiche. \"Come gli aggiornamenti delle segnalazioni\" le invia quando Redmine invia gli aggiornamenti delle segnalazioni (Amministrazione » Impostazioni » Notifiche via email)."
