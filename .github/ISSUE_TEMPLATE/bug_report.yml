name: Bug report
description: Report a problem with the expert Checklists plugin
labels: ["bug"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I am running the latest release of the plugin
          required: true
        - label: The plugin migration was run (rake redmine:plugins:migrate NAME=redmine_expert_checklists)
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open an issue with a checklist
        2. Tick an item
        3. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Checklist on the issue page (ticking)
        - Checklist editor in the issue form
        - History / notification mails
        - Issue list column / filters / export
        - REST API
        - Import from RedmineUP Checklists
        - Installation / migration
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Redmine version, Ruby version, database, and other installed plugins.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: production.log around the problem, or the API response you got.
      render: text
