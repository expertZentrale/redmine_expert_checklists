  text_expert_checklist_editor_hint: "Intro añade el siguiente elemento y Alt+Flecha arriba/abajo lo mueve. Al pegar varias líneas se añade un elemento por línea; una línea que empieza por -- se convierte en una sección."
  error_expert_checklist_save_failed: "No se ha guardado - recargue la página"
  error_expert_checklist_open_items: "La petición no se puede cerrar mientras haya elementos abiertos en la lista de verificación."

  # History (%{label} is "Checklist", %{subject}/%{old}/%{new} are item texts)
  text_expert_checklist_item_added: "%{label}: elemento %{subject} añadido"
