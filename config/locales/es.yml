  # Issue list
  field_expert_checklist_status: "Elementos de la lista de verificación"
  field_expert_checklist_item: "Texto de un elemento de la lista de verificación"
  label_expert_checklist_status_open: "abiertos"
  label_expert_checklist_status_done: "completados"

  # Plugin settings
  label_expert_checklist_notifications: "Correos por cambios en listas de verificación"
  label_expert_checklist_notifications_issue_updated: "Como las actualizaciones de peticiones"
  label_expert_checklist_notifications_always: "Siempre"
  label_expert_checklist_notifications_never: "Nunca"
  text_expert_checklist_notifications: "Las marcas del mismo usuario en un plazo de %{seconds} segundos se agrupan en una sola entrada del histórico y un solo correo, que se envía cuando nadie ha marcado nada durante ese tiempo. Los cambios en la lista de verificación guardados con el formulario de la petición se envían de inmediato, junto con el resto de la modificación. \"Como las actualizaciones de peticiones\" los envía cuando Redmine envía las actualizaciones de peticiones (Administración » Configuración » Notificaciones por correo)."
  label_expert_checklist_done_ratio: "% Realizado según la lista de verificación"
  text_expert_checklist_done_ratio: "Establece % Realizado según la proporción de elementos marcados, redondeada hacia abajo a la decena. Las secciones no cuentan; una petición sin elementos conserva su valor."
  text_expert_checklist_done_ratio_inactive: "No tiene efecto por ahora: % Realizado se calcula a partir del estado de la petición (Administración » Configuración » Peticiones)."
  label_expert_checklist_block_closing: "Bloquear el cierre con elementos abiertos"
  text_expert_checklist_block_closing: "Una petición no puede pasar a un estado cerrado mientras tenga elementos abiertos en la lista de verificación."
  label_expert_checklist_legacy_import: "Importar desde RedmineUP Checklists"
  text_expert_checklist_legacy_import_intro: "Importa las listas de verificación, los permisos, la configuración y las consultas guardadas del plugin RedmineUP Checklists. Muestra lo que se importaría antes de escribir nada."
  text_expert_checklist_legacy_import_done_at: "Última importación: %{time}"
  label_expert_checklist_legacy_import_open: "Abrir la importación"

  # RedmineUP import page
  label_expert_checklist_import_phase: "Paso"
  label_expert_checklist_import_found: "Encontrado"
  label_expert_checklist_import_phase_items: "Listas de verificación"
  label_expert_checklist_import_phase_permissions: "Permisos"
  label_expert_checklist_import_phase_settings: "Configuración"
  label_expert_checklist_import_phase_queries: "Consultas guardadas"
  label_expert_checklist_import_phase_modules: "Módulo del proyecto"
  text_expert_checklist_import_phase_items: "Copia los elementos con los mismos ID, para que el histórico de RedmineUP siga siendo legible. Mientras RedmineUP esté instalado, las peticiones de los proyectos aún no cambiados se copian de nuevo (allí RedmineUP sigue en uso); si no, solo las peticiones sin lista de verificación de este plugin."
  text_expert_checklist_import_phase_permissions: "Todo perfil que pueda ver, marcar o editar listas de verificación de RedmineUP recibe aquí el mismo permiso."
  text_expert_checklist_import_phase_settings: "% Realizado según la lista de verificación, el bloqueo del cierre y la configuración de correo."
  text_expert_checklist_import_phase_queries: "Sustituye la columna y los filtros de lista de verificación de RedmineUP en las consultas de peticiones guardadas."
  text_expert_checklist_import_phase_modules: "Activa el módulo expert Listas de verificación en cada proyecto que usa peticiones, y para los proyectos nuevos; allí se desactiva el módulo propio de RedmineUP, si lo tiene."
  text_expert_checklist_import_items: "%{items} elementos en %{issues} peticiones; %{pending} peticiones por importar, %{done} ya importadas"
  text_expert_checklist_import_items_skipped: "Omitidos: %{orphans} elementos de peticiones eliminadas, %{blank} elementos vacíos. %{long} elementos se recortan a 1000 caracteres."
  text_expert_checklist_import_roles: "%{count} perfiles por actualizar"
  text_expert_checklist_import_queries: "%{count} consultas por convertir"
  text_expert_checklist_import_projects: "%{count} proyectos por activar"
  text_expert_checklist_import_blocked: "Solo cuando RedmineUP Checklists se haya eliminado o pueda desactivarse por proyecto: de lo contrario, cada petición muestra dos listas de verificación."
  text_expert_checklist_import_redmineup_installed: "RedmineUP Checklists sigue instalado. Las listas de verificación, los permisos y la configuración se pueden importar para probar; las consultas guardadas y el módulo del proyecto llegan una vez eliminado RedmineUP, o proyecto por proyecto más abajo."
  text_expert_checklist_import_no_table: "No se han encontrado datos de RedmineUP Checklists."
  button_expert_checklist_import_run: "Importar"
  notice_expert_checklist_import_done: "Importación completada: %{result}"
  error_expert_checklist_import_no_phase: "No se ha importado nada - elija al menos un paso."
  text_expert_checklist_import_queries_blocked: "Solo cuando todos los proyectos se hayan cambiado o RedmineUP Checklists se haya eliminado: las consultas convertidas no encontrarían nada en los proyectos que aún usan RedmineUP. Las consultas de un proyecto se convierten al cambiar ese proyecto."
  label_expert_checklist_import_projects: "Cambiar proyecto por proyecto"
  text_expert_checklist_import_projects_intro: "Cambia los proyectos elegidos de RedmineUP Checklists a expert Listas de verificación mientras RedmineUP sigue instalado para los demás: vuelve a copiar las listas de verificación de sus peticiones y sus plantillas, convierte sus consultas guardadas, activa nuestro módulo y desactiva el de RedmineUP. Importe antes los permisos y la configuración de arriba."
  text_expert_checklist_import_projects_status: "%{switched} proyectos cambiados, %{left} todavía no."
  text_expert_checklist_import_not_switchable: "RedmineUP Checklists no se puede desactivar en un solo proyecto: sus permisos pertenecen al módulo de peticiones. Para cambiar proyecto por proyecto, deben pasar a un módulo de proyecto propio (véase el README)."
  button_expert_checklist_import_switch: "Cambiar proyectos"
  notice_expert_checklist_import_projects_done: "Cambiados %{projects}: %{result}"
  error_expert_checklist_import_no_project: "No se ha cambiado nada - elija al menos un proyecto."
  error_expert_checklist_import_project_without_issues: "Estos proyectos no usan peticiones, no hay nada que cambiar: %{projects}"

  # Templates
  label_expert_checklist_templates: "Plantillas de listas de verificación"
  label_expert_checklist_templates_global: "Plantillas globales"
  label_expert_checklist_template_new: "Nueva plantilla"
  label_expert_checklist_template_categories: "Categorías de plantillas"
  label_expert_checklist_template_category_new: "Nueva categoría"
  label_expert_checklist_from_template: "Añadir desde plantilla…"
  field_expert_checklist_template_items: "Elementos"
  field_expert_checklist_template_is_default: "Predeterminada para peticiones nuevas"
  text_expert_checklist_template_items: "Un elemento por línea. Una línea que empieza con -- es una sección, [x] marca un elemento como hecho."
  text_expert_checklist_template_default: "Las peticiones nuevas de este proyecto empiezan con esta lista de verificación; solo las del tipo elegido, si se indica uno. Las plantillas de un tipo van antes que las de todos los tipos, las del proyecto antes que las globales."
  text_expert_checklist_template_default_global: "Las peticiones nuevas de cada proyecto con expert Listas de verificación empiezan con esta lista de verificación, salvo que el proyecto tenga una predeterminada propia; solo las del tipo elegido, si se indica uno."
  text_expert_checklist_template_added: "%{count} elementos añadidos desde la plantilla"
  text_expert_checklist_templates_global: "Plantillas para todos los proyectos. Aparecen en el formulario de la petición junto a las plantillas del proyecto."
  text_expert_checklist_templates_global_in_project: "Las gestionan los administradores. Una predeterminada de este proyecto va antes."
  text_expert_checklist_template_categories: "Las categorías agrupan las plantillas en el menú del formulario de la petición. Arrastre para reordenar."
  label_expert_checklist_import_phase_templates: "Plantillas"
  text_expert_checklist_import_phase_templates: "Copia las plantillas y categorías de listas de verificación de RedmineUP. Mientras RedmineUP esté instalado, las plantillas de los proyectos aún no cambiados se copian de nuevo; las globales se añaden si faltan. Las globales llegan sin marca de predeterminada, ya que RedmineUP solo aplicaba las del proyecto."
  text_expert_checklist_import_templates: "%{count} plantillas, %{defaults} de ellas predeterminadas"
