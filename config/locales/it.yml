  text_expert_checklist_import_queries_blocked: "Solo quando tutti i progetti sono passati o RedmineUP Checklists è stato rimosso: le query convertite non troverebbero nulla nei progetti che usano ancora RedmineUP. Le query di un progetto vengono convertite quando il progetto passa."
  label_expert_checklist_import_projects: "Passare progetto per progetto"
  text_expert_checklist_import_projects_intro: "Passa i progetti scelti da RedmineUP Checklists a expert Checklist mentre RedmineUP resta installato per gli altri: copia di nuovo le checklist delle loro segnalazioni, converte le loro query salvate, attiva il nostro modulo e disattiva quello di RedmineUP. Importa prima permessi e impostazioni qui sopra."
