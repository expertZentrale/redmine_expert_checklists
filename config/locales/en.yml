en:
  label_expert_checklists: "expert Checklists"
  project_module_expert_checklists: "expert Checklists"
  permission_view_expert_checklists: "View checklists"
  permission_done_expert_checklists: "Tick checklist items"
  permission_edit_expert_checklists: "Edit checklists"

  # Issue page and form
  label_expert_checklist: "Checklist"
  label_expert_checklist_item: "Checklist item"
  label_expert_checklist_section: "Section"
  label_expert_checklist_done: "Done"
  label_expert_checklist_add_item: "Add item"
  label_expert_checklist_add_section: "Add section"
  label_expert_checklist_drag: "Drag to reorder"
  label_expert_checklist_move_up: "Move up"
  label_expert_checklist_move_down: "Move down"
  label_expert_checklist_hide_done: "Hide done"
  label_expert_checklist_show_done: "Show done"
  text_expert_checklist_moved: "Moved to position %{position}"
  text_expert_checklist_editor_hint: "Enter adds the next item, Alt+Up/Down moves it. Pasting several lines adds one item per line; a line starting with -- becomes a section."
  error_expert_checklist_save_failed: "Not saved - please reload the page"
  error_expert_checklist_open_items: "The issue cannot be closed while checklist items are open."

  # History (%{label} is "Checklist", %{subject}/%{old}/%{new} are item texts)
  text_expert_checklist_item_added: "%{label} item %{subject} added"
  text_expert_checklist_section_added: "%{label} section %{subject} added"
  text_expert_checklist_item_deleted: "%{label} item %{subject} deleted"
  text_expert_checklist_section_deleted: "%{label} section %{subject} deleted"
  text_expert_checklist_item_done: "%{label} item %{subject} done"
  text_expert_checklist_item_undone: "%{label} item %{subject} reopened"
  text_expert_checklist_item_renamed: "%{label} item changed from %{old} to %{new}"
  text_expert_checklist_section_renamed: "%{label} section changed from %{old} to %{new}"
  text_expert_checklist_item_to_section: "%{label} item %{subject} turned into a section"
  text_expert_checklist_section_to_item: "%{label} section %{subject} turned into an item"
  text_expert_checklist_reordered: "%{label} reordered"

  # Issue list
  field_expert_checklist_status: "Checklist items"
  field_expert_checklist_item: "Checklist item text"
  label_expert_checklist_status_open: "open"
  label_expert_checklist_status_done: "done"

  # Plugin settings
  label_expert_checklist_notifications: "Mails for checklist changes"
  label_expert_checklist_notifications_issue_updated: "Like issue updates"
  label_expert_checklist_notifications_always: "Always"
  label_expert_checklist_notifications_never: "Never"
  text_expert_checklist_notifications: "Ticks by the same user within %{seconds} seconds become one history entry and one mail, sent once nobody has ticked for that long. Checklist changes saved with the issue form go out right away, together with the rest of the edit. \"Like issue updates\" mails them when Redmine mails issue updates (Administration » Settings » Email notifications)."
  label_expert_checklist_done_ratio: "% Done from the checklist"
  text_expert_checklist_done_ratio: "Sets % Done to the share of ticked items, rounded down to tens. Sections do not count; an issue without items keeps its value."
  text_expert_checklist_done_ratio_inactive: "Has no effect at the moment: % Done is calculated from the issue status (Administration » Settings » Issue tracking)."
  label_expert_checklist_block_closing: "Block closing with open items"
  text_expert_checklist_block_closing: "An issue cannot be set to a closed status while it has open checklist items."
  label_expert_checklist_legacy_import: "Import from RedmineUP Checklists"
  text_expert_checklist_legacy_import_intro: "Takes over checklists, permissions, settings and saved queries from the RedmineUP Checklists plugin. Shows what would be imported before anything is written."
  text_expert_checklist_legacy_import_done_at: "Last import: %{time}"
  label_expert_checklist_legacy_import_open: "Open the import"

  # RedmineUP import page
  label_expert_checklist_import_phase: "Step"
  label_expert_checklist_import_found: "Found"
  label_expert_checklist_import_phase_items: "Checklists"
  label_expert_checklist_import_phase_permissions: "Permissions"
  label_expert_checklist_import_phase_settings: "Settings"
  label_expert_checklist_import_phase_queries: "Saved queries"
  label_expert_checklist_import_phase_modules: "Project module"
  text_expert_checklist_import_phase_items: "Copies the items with the same ids, so the RedmineUP history stays readable. While RedmineUP is installed, issues of projects not switched yet are copied again (RedmineUP is still in use there); otherwise only issues without a checklist of ours."
  text_expert_checklist_import_phase_permissions: "Every role that may view, tick or edit RedmineUP checklists gets the same permission here."
  text_expert_checklist_import_phase_settings: "% Done from the checklist, blocking the close, and the mail setting."
  text_expert_checklist_import_phase_queries: "Replaces RedmineUP's checklist column and filters in saved issue queries."
  text_expert_checklist_import_phase_modules: "Switches the expert Checklists module on in every project that uses issue tracking, and for new projects; RedmineUP's own module goes off there if it has one."
  text_expert_checklist_import_items: "%{items} items on %{issues} issues; %{pending} issues to import, %{done} already imported"
  text_expert_checklist_import_items_skipped: "Skipped: %{orphans} items of deleted issues, %{blank} empty items. %{long} items are cut to 1000 characters."
  text_expert_checklist_import_roles: "%{count} roles to update"
  text_expert_checklist_import_queries: "%{count} queries to convert"
  text_expert_checklist_import_projects: "%{count} projects to switch on"
  text_expert_checklist_import_blocked: "Only once RedmineUP Checklists has been removed or can be switched off per project: otherwise every issue shows two checklists."
  text_expert_checklist_import_redmineup_installed: "RedmineUP Checklists is still installed. Checklists, permissions and settings can be imported to try it out; saved queries and the project module follow once RedmineUP has been removed, or project by project below."
  text_expert_checklist_import_no_table: "No RedmineUP Checklists data found."
  button_expert_checklist_import_run: "Import"
  notice_expert_checklist_import_done: "Import done: %{result}"
  error_expert_checklist_import_no_phase: "Nothing imported - choose at least one step."
  text_expert_checklist_import_queries_blocked: "Only once every project has been switched or RedmineUP Checklists has been removed: converted queries would find nothing in projects still using RedmineUP. The queries of a project are converted when it is switched."
  label_expert_checklist_import_projects: "Switch project by project"
  text_expert_checklist_import_projects_intro: "Switches the chosen projects from RedmineUP Checklists to expert Checklists while RedmineUP stays installed for the others: copies the checklists of their issues again, converts their saved queries, switches our module on and RedmineUP's off. Import permissions and settings above first."
  text_expert_checklist_import_projects_status: "%{switched} projects switched, %{left} not yet."
  text_expert_checklist_import_not_switchable: "RedmineUP Checklists cannot be switched off in a single project: its permissions belong to the issue tracking module. To switch project by project, they have to move to a project module of their own (see the README)."
  button_expert_checklist_import_switch: "Switch projects"
  notice_expert_checklist_import_projects_done: "Switched %{projects}: %{result}"
  error_expert_checklist_import_no_project: "Nothing switched - choose at least one project."
